{% extends "base.html" %}

{% block page_heading %}
    {{ title }}
{% endblock %}

{% block content %}

<div class="page-toolbar">
    <div>
        <div class="eyebrow">POWERTRACK MANAGEMENT</div>
        <p class="page-description">
            Enter the required information below.
        </p>
    </div>
</div>

<div class="panel form-box">

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="d-flex gap-2 pt-2">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check2"></i>
                Save
            </button>

            <a class="btn btn-outline-secondary" href="{% url back %}">
                Cancel
            </a>
        </div>
    </form>

</div>

{% endblock %}
