{% extends "base.html" %}

{% block page_heading %}
    {{ title }}
{% endblock %}

{% block content %}
    <div class="panel form-box">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary">Save</button>
            <a class="btn btn-outline-secondary" href="{% url back %}">Cancel</a>
        </form>
    </div>
{% endblock %}
